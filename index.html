<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ristorante Savino - Gestione Ordini</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f8fafc; color: #0f172a; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #1e293b; color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 16px; font-weight: 700; }
        nav { display: flex; background: #0f172a; border-bottom: 1px solid #334155; }
        .nav-btn { flex: 1; padding: 12px 4px; text-align: center; color: #94a3b8; background: none; border: none; font-size: 11px; font-weight: 600; cursor: pointer; }
        .nav-btn.active { color: #38bdf8; border-bottom: 3px solid #38bdf8; background-color: rgba(255,255,255,0.05); }
        .main-content { flex: 1; overflow-y: auto; padding: 12px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: white; border-radius: 8px; border: 1px solid #e2e8f0; padding: 12px; margin-bottom: 12px; }
        .card-title { font-size: 14px; font-weight: 700; color: #1e293b; margin-bottom: 8px; }
        .btn { padding: 8px 12px; border-radius: 6px; font-weight: 600; font-size: 13px; border: none; cursor: pointer; }
        .btn-primary { background-color: #0284c7; color: white; }
        .btn-success { background-color: #16a34a; color: white; }
        .btn-danger { background-color: #dc2626; color: white; }
        .grid-select { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 6px; margin-bottom: 12px; }
        .grid-btn { padding: 8px 4px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; text-align: center; font-size: 12px; font-weight: 600; cursor: pointer; }
        .grid-btn.selected { background: #0284c7; color: white; border-color: #0284c7; }
        .product-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f1f5f9; }
        .qty-controls { display: flex; align-items: center; gap: 8px; }
        .qty-btn { width: 32px; height: 32px; border-radius: 6px; border: 1px solid #cbd5e1; background: #f8fafc; font-weight: bold; font-size: 16px; }
        .qty-val { width: 30px; text-align: center; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; margin-bottom: 8px; }
        .status-badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #16a34a; color: white; }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>Savino Ordini</h1>
            <span class="status-badge">⚡ Attivo / Locale</span>
        </div>
        <span id="header-tot" style="font-size: 12px; background: #0284c7; padding: 4px 8px; border-radius: 4px;">Tot: €0.00</span>
    </header>

    <nav>
        <button class="nav-btn active" onclick="switchTab('tab-ordini', event)">🛒 Ordina</button>
        <button class="nav-btn" onclick="switchTab('tab-fornitori', event)">📱 Invia</button>
        <button class="nav-btn" onclick="switchTab('tab-gestione', event)">⚙️ Gestisci</button>
    </nav>

    <div class="main-content">
        <div id="tab-ordini" class="tab-content active">
            <div class="card">
                <div class="card-title">Categorie</div>
                <div class="grid-select" id="cat-grid"></div>
            </div>
            <div class="card">
                <div class="card-title">Prodotti</div>
                <div id="prod-list"></div>
            </div>
        </div>

        <div id="tab-fornitori" class="tab-content">
            <div id="summary-fornitori">Nessun prodotto selezionato.</div>
        </div>

        <div id="tab-gestione" class="tab-content">
            <div class="card">
                <div class="card-title">Aggiungi Fornitore</div>
                <input type="text" id="new-fornitore-nome" placeholder="Nome Fornitore">
                <input type="text" id="new-fornitore-tel" placeholder="Numero WhatsApp">
                <button class="btn btn-primary" onclick="addFornitore()">+ Aggiungi Fornitore</button>
            </div>

            <div class="card">
                <div class="card-title">Aggiungi Prodotto</div>
                <input type="text" id="new-prod-nome" placeholder="Nome Prodotto">
                <select id="new-prod-cat">
                    <option value="Pesce">Pesce</option>
                    <option value="Carne">Carne</option>
                    <option value="Ortofrutta">Ortofrutta</option>
                    <option value="Secco/Scatolame">Secco/Scatolame</option>
                    <option value="Latticini">Latticini</option>
                    <option value="Bevande">Bevande</option>
                    <option value="Altro">Altro</option>
                </select>
                <select id="new-prod-fornitore"></select>
                <input type="text" id="new-prod-unita" placeholder="Unità (es. kg, cassa)">
                <input type="text" id="new-prod-prezzo" placeholder="Prezzo (€)">
                <button class="btn btn-primary" onclick="addProdotto()">+ Aggiungi Prodotto</button>
            </div>

            <div class="card" style="text-align:center;">
                <button class="btn btn-danger" onclick="resetLocale()">⚠ Ripristina Memoria App</button>
            </div>
        </div>
    </div>

    <script>
        let defaultFornitori = [
            { id: 'f1', nome: 'Ortofrutta Locale', tel: '+39330000001' },
            { id: 'f2', nome: 'Pescheria del Porto', tel: '+39330000002' }
        ];

        let defaultProdotti = [
            { id: 'p1', nome: 'Sarde Fresche', cat: 'Pesce', fornitoreId: 'f2', unita: 'kg', prezzo: 8.5 },
            { id: 'p2', nome: 'Gambero Rosso', cat: 'Pesce', fornitoreId: 'f2', unita: 'kg', prezzo: 35.0 },
            { id: 'p3', nome: 'Pomodoro Ciliegino', cat: 'Ortofrutta', fornitoreId: 'f1', unita: 'kg', prezzo: 2.2 }
        ];

        let fornitori = JSON.parse(localStorage.getItem('savino_fornitori')) || defaultFornitori;
        let prodotti = JSON.parse(localStorage.getItem('savino_prodotti')) || defaultProdotti;
        let carrello = JSON.parse(localStorage.getItem('savino_carrello')) || {};
        let currentCat = 'Pesce';

        function parsePrice(val) {
            if (!val) return 0;
            let num = parseFloat(String(val).replace(',', '.'));
            return isNaN(num) ? 0 : num;
        }

        function saveData() {
            localStorage.setItem('savino_fornitori', JSON.stringify(fornitori));
            localStorage.setItem('savino_prodotti', JSON.stringify(prodotti));
            localStorage.setItem('savino_carrello', JSON.stringify(carrello));
            updateHeaderTotal();
        }

        function switchTab(tabId, ev) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if (ev && ev.currentTarget) ev.currentTarget.classList.add('active');
            if (tabId === 'tab-ordini') renderOrdini();
            if (tabId === 'tab-fornitori') renderInvio();
            if (tabId === 'tab-gestione') renderGestione();
        }

        function updateHeaderTotal() {
            let tot = 0;
            for (let id in carrello) {
                let p = prodotti.find(x => x.id === id);
                if (p) tot += carrello[id] * p.prezzo;
            }
            document.getElementById('header-tot').innerText = `Tot: €${tot.toFixed(2)}`;
        }

        function renderOrdini() {
            let categorie = ['Pesce', 'Carne', 'Ortofrutta', 'Secco/Scatolame', 'Latticini', 'Bevande', 'Altro'];
            let catGrid = document.getElementById('cat-grid');
            catGrid.innerHTML = '';
            categorie.forEach(c => {
                let btn = document.createElement('div');
                btn.className = `grid-btn ${c === currentCat ? 'selected' : ''}`;
                btn.innerText = c;
                btn.onclick = () => { currentCat = c; renderOrdini(); };
                catGrid.appendChild(btn);
            });

            let prodList = document.getElementById('prod-list');
            prodList.innerHTML = '';
            let filtered = prodotti.filter(p => p.cat === currentCat);

            if (filtered.length === 0) {
                prodList.innerHTML = '<p style="font-size:13px; color:#64748b; padding:10px 0;">Nessun prodotto presente.</p>';
                return;
            }

            filtered.forEach(p => {
                let qty = carrello[p.id] || 0;
                let item = document.createElement('div');
                item.className = 'product-item';
                item.innerHTML = `
                    <div>
                        <strong style="font-size:14px;">${p.nome}</strong>
                        <div style="font-size:11px; color:#64748b;">€${p.prezzo.toFixed(2)} / ${p.unita}</div>
                    </div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="updateQty('${p.id}', -1)">-</button>
                        <span class="qty-val">${qty}</span>
                        <button class="qty-btn" onclick="updateQty('${p.id}', 1)">+</button>
                    </div>
                `;
                prodList.appendChild(item);
            });
        }

        function updateQty(prodId, delta) {
            let current = carrello[prodId] || 0;
            let next = current + delta;
            if (next <= 0) delete carrello[prodId];
            else carrello[prodId] = next;
            saveData();
            renderOrdini();
        }

        function renderInvio() {
            let container = document.getElementById('summary-fornitori');
            container.innerHTML = '';
            let grouped = {};
            for (let id in carrello) {
                let p = prodotti.find(x => x.id === id);
                if (p) {
                    if (!grouped[p.fornitoreId]) grouped[p.fornitoreId] = [];
                    grouped[p.fornitoreId].push({ prod: p, qty: carrello[id] });
                }
            }

            if (Object.keys(grouped).length === 0) {
                container.innerHTML = '<p style="font-size:13px; color:#64748b;">Nessun ordine nel carrello.</p>';
                return;
            }

            for (let fId in grouped) {
                let fObj = fornitori.find(x => x.id === fId) || { nome: 'Fornitore', tel: '' };
                let items = grouped[fId];
                let subtot = 0;
                let textMsg = `*ORDINE RISTORANTE SAVINO*\n\n`;

                let card = document.createElement('div');
                card.className = 'card';
                let html = `<div class="card-title">${fObj.nome}</div><ul style="margin-bottom:10px; font-size:13px; list-style:none;">`;

                items.forEach(i => {
                    let cost = i.qty * i.prod.prezzo;
                    subtot += cost;
                    html += `<li style="padding:4px 0;">${i.prod.nome}: <strong>${i.qty} ${i.prod.unita}</strong> (€${cost.toFixed(2)})</li>`;
                    textMsg += `• ${i.prod.nome}: ${i.qty} ${i.prod.unita}\n`;
                });

                textMsg += `\n*Totale: €${subtot.toFixed(2)}*`;
                html += `</ul><div style="display:flex; justify-content:space-between; align-items:center;">
                            <strong>Totale: €${subtot.toFixed(2)}</strong>
                            <button class="btn btn-success" onclick="window.open('https://wa.me/${fObj.tel}?text=${encodeURIComponent(textMsg)}', '_blank')">📱 WhatsApp</button>
                         </div>`;
                card.innerHTML = html;
                container.appendChild(card);
            }
        }

        function renderGestione() {
            let fSelect = document.getElementById('new-prod-fornitore');
            fSelect.innerHTML = '';
            fornitori.forEach(f => {
                fSelect.innerHTML += `<option value="${f.id}">${f.nome}</option>`;
            });
        }

        function addFornitore() {
            let nome = document.getElementById('new-fornitore-nome').value.trim();
            let tel = document.getElementById('new-fornitore-tel').value.trim();
            if (!nome) return alert('Inserisci il nome del fornitore');
            fornitori.push({ id: 'f_' + Date.now(), nome, tel });
            saveData();
            document.getElementById('new-fornitore-nome').value = '';
            document.getElementById('new-fornitore-tel').value = '';
            renderGestione();
        }

        function addProdotto() {
            let nome = document.getElementById('new-prod-nome').value.trim();
            let cat = document.getElementById('new-prod-cat').value;
            let fornitoreId = document.getElementById('new-prod-fornitore').value;
            let unita = document.getElementById('new-prod-unita').value.trim() || 'kg';
            let prezzo = parsePrice(document.getElementById('new-prod-prezzo').value);

            if (!nome) return alert('Inserisci il nome del prodotto');
            prodotti.push({ id: 'p_' + Date.now(), nome, cat, fornitoreId, unita, prezzo });
            saveData();
            document.getElementById('new-prod-nome').value = '';
            document.getElementById('new-prod-prezzo').value = '';
            renderOrdini();
            alert('Prodotto aggiunto!');
        }

        function resetLocale() {
            if (confirm("Ripristinare l'app allo stato iniziale?")) {
                localStorage.clear();
                location.reload();
            }
        }

        saveData();
        renderOrdini();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UZZO CHEF ordini</title>
    
    <!-- Font Moderno Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* SFONDO GRIGIO MOLTO CHIARO */
        body { background-color: #f3f4f6; color: #1f2937; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* HEADER & NAV IN VERDE MILITARE CON EFFETTO VETRO */
        header { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            color: #1f2937; 
            padding: 12px 16px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid #4b5320;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header h1 { font-size: 18px; font-weight: 800; color: #4b5320; letter-spacing: -0.5px; }
        
        nav { 
            display: flex; 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid #e5e7eb; 
            overflow-x: auto; 
            position: sticky;
            top: 53px;
            z-index: 99;
        }
        .nav-btn { 
            flex: 1; 
            min-width: 70px; 
            padding: 12px 6px; 
            text-align: center; 
            color: #6b7280; 
            background: none; 
            border: none; 
            font-size: 12px; 
            font-weight: 600; 
            cursor: pointer; 
            white-space: nowrap; 
            border-bottom: 3px solid transparent; 
            transition: all 0.2s ease;
        }
        .nav-btn.active { color: #4b5320; border-bottom-color: #4b5320; background-color: rgba(75, 83, 32, 0.08); }

        .main-content { flex: 1; overflow-y: auto; padding: 14px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* CARDS */
        .card { 
            background: #ffffff; 
            border-radius: 12px; 
            border: 1px solid #e5e7eb; 
            padding: 14px; 
            margin-bottom: 14px; 
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        
        .card-title { font-size: 14px; font-weight: 700; color: #374151; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .card-title-collapsible { font-size: 14px; font-weight: 700; color: #374151; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; padding: 2px 0; }
        .arrow-icon { font-size: 11px; color: #4b5320; transition: transform 0.25s ease; display: inline-block; }
        .arrow-icon.rotated { transform: rotate(180deg); }

        /* PULSANTI VERDE MILITARE E ACCENTI */
        .btn { 
            padding: 9px 14px; 
            border-radius: 8px; 
            font-weight: 600; 
            font-size: 13px; 
            border: none; 
            cursor: pointer; 
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background-color: #4b5320; color: white; box-shadow: 0 2px 4px rgba(75, 83, 32, 0.25); }
        .btn-success { background-color: #16a34a; color: white; box-shadow: 0 2px 4px rgba(22, 163, 74, 0.2); }
        .btn-danger { background-color: #dc2626; color: white; }
        .btn-warning { background-color: #d97706; color: white; }
        .btn-sm { padding: 4px 8px; font-size: 11px; border-radius: 6px; }

        /* PULSANTE WHATSAPP */
        .btn-whatsapp {
            background-color: #25D366;
            color: white;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
            border-radius: 8px;
            padding: 10px 16px;
        }
        .btn-whatsapp:active { transform: scale(0.95); }

        /* GRIGLIA CATEGORIE */
        .grid-select { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 8px; margin-bottom: 12px; }
        .grid-btn { 
            padding: 10px 6px; 
            background: #f9fafb; 
            border: 1px solid #d1d5db; 
            border-radius: 10px; 
            text-align: center; 
            font-size: 12px; 
            font-weight: 600; 
            color: #374151; 
            cursor: pointer; 
            transition: all 0.15s ease;
        }
        .grid-btn:active { transform: scale(0.95); }
        .grid-btn.selected { background: #4b5320; color: white; border-color: #4b5320; box-shadow: 0 3px 8px rgba(75, 83, 32, 0.3); }

        /* PRODOTTI LISTA CON CONTROLLI + / - */
        .product-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f3f4f6; }
        .qty-controls { display: flex; align-items: center; gap: 8px; }
        .qty-btn { 
            width: 34px; 
            height: 34px; 
            border-radius: 8px; 
            border: 1px solid #d1d5db; 
            background: #ffffff; 
            font-weight: 700; 
            font-size: 16px; 
            color: #4b5320;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            transition: all 0.1s ease;
        }
        .qty-btn:active { transform: scale(0.88); background: #f4f5f0; }
        .qty-val { width: 32px; text-align: center; font-weight: 700; font-size: 15px; color: #111827; }

        input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 13px; margin-bottom: 10px; background: #ffffff; transition: border-color 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: #4b5320; outline: none; }
        textarea { resize: vertical; min-height: 80px; font-family: monospace; }
        
        .status-badge { font-size: 11px; padding: 3px 8px; border-radius: 20px; background: rgba(75, 83, 32, 0.12); color: #4b5320; font-weight: 700; }
        
        /* TOTALE HEADER VERDE MILITARE */
        #header-tot { 
            font-size: 13px; 
            font-weight: 700;
            background: #4b5320; 
            color: white;
            padding: 5px 11px; 
            border-radius: 20px; 
            box-shadow: 0 2px 6px rgba(75, 83, 32, 0.3);
            transition: transform 0.2s ease;
        }
        #header-tot.bounce { transform: scale(1.12); }

        /* TABELLA CATALOGO */
        .catalog-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
        .catalog-table th { background: #f9fafb; text-align: left; padding: 8px; color: #4b5563; font-weight: 600; border-bottom: 1px solid #d1d5db; }
        .catalog-table td { padding: 8px; border-bottom: 1px solid #f3f4f6; vertical-align: middle; }
        .actions-cell { display: flex; gap: 4px; justify-content: flex-end; }
        
        .collapsible-body { display: block; margin-top: 4px; transition: all 0.2s ease; }
        .collapsible-body.collapsed { display: none; }

        .cat-tag { display: inline-flex; align-items: center; justify-content: space-between; background: #e5e7eb; border: 1px solid #d1d5db; padding: 4px 10px; border-radius: 20px; font-size: 12px; margin: 3px; font-weight: 500; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

    <header>
        <div>
            <h1>UZZO CHEF ordini</h1>
            <span class="status-badge">🍳 Cucina / Locale</span>
        </div>
        <span id="header-tot">Tot: €0.00</span>
    </header>

    <nav>
        <button class="nav-btn active" onclick="switchTab('tab-ordini', event)">🛒 Ordina</button>
        <button class="nav-btn" onclick="switchTab('tab-fornitori', event)">📱 Invia</button>
        <button class="nav-btn" onclick="switchTab('tab-indice', event)">📋 Indice</button>
        <button class="nav-btn" onclick="switchTab('tab-gestione', event)">⚙️ Gestisci</button>
    </nav>

    <div class="main-content">
        <!-- TAB ORDINI -->
        <div id="tab-ordini" class="tab-content active">
            <div class="card">
                <div class="card-title">Categorie Prodotti</div>
                <div class="grid-select" id="cat-grid"></div>
            </div>
            <div class="card">
                <div class="card-title">Prodotti</div>
                <div id="prod-list"></div>
            </div>
        </div>

        <!-- TAB INVIA -->
        <div id="tab-fornitori" class="tab-content">
            <div id="summary-fornitori">Nessun prodotto selezionato.</div>
        </div>

        <!-- TAB INDICE CATALOGO -->
        <div id="tab-indice" class="tab-content">
            <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h3 style="font-size: 15px; font-weight: 700;">Catalogo per Fornitore</h3>
                    <span style="font-size: 11px; color: #6b7280;">Tocca un fornitore per aprire/chiudere</span>
                </div>
                <button class="btn btn-success" onclick="exportToExcel()">📥 Scarica Excel</button>
            </div>
            <div id="indice-container"></div>
        </div>

        <!-- TAB GESTIONE -->
        <div id="tab-gestione" class="tab-content">
            
            <!-- GESTIONE CATEGORIE CON SCELTA ICONA -->
            <div class="card">
                <div class="card-title">🏷️ Gestisci Categorie & Icone</div>
                <div style="display: flex; gap: 6px; margin-bottom: 8px;">
                    <select id="new-cat-icon" style="width: 75px; margin-bottom:0;">
                        <option value="🐟">🐟 Pesce</option>
                        <option value="🥩">🥩 Carne</option>
                        <option value="🥦">🥦 Ortofrutta</option>
                        <option value="🥗">🥗 Insalate/Verdura</option>
                        <option value="🧀">🧀 Latticini/Formaggi</option>
                        <option value="🍝">🍝 Pasta/Riso</option>
                        <option value="🌾">🌾 Farina/Cereali</option>
                        <option value="🥫">🥫 Secco/Scatolame</option>
                        <option value="🥖">🥖 Pane/Forno</option>
                        <option value="🍷">🍷 Vino/Bevande</option>
                        <option value="🍺">🍺 Birra/Alcolici</option>
                        <option value="☕">☕ Caffe/Bar</option>
                        <option value="🏺">🏺 Olio/Condimenti</option>
                        <option value="🌶️">🌶️ Spezie/Aromi</option>
                        <option value="🍰">🍰 Dolci/Pasticceria</option>
                        <option value="🧼">🧼 Pulizia/Igiene</option>
                        <option value="🛒">🛒 Altro</option>
                    </select>
                    <input type="text" id="new-cat-nome" placeholder="Nome Categoria" style="margin-bottom:0; flex:1;">
                    <button class="btn btn-primary" onclick="addCategoria()">+ Aggiungi</button>
                </div>
                <div id="categories-list-container" style="margin-top: 8px;"></div>
            </div>

            <!-- INCOLLA MULTI-RIGA / BLOCCO -->
            <div class="card" style="border: 2px solid #4b5320;">
                <div class="card-title" style="color: #4b5320;">⚡ Importa Prodotti in Blocco (Incolla Testo)</div>
                <label style="font-size: 11px; color: #6b7280;">Fornitore di Destinazione:</label>
                <select id="bulk-prod-fornitore"></select>
                
                <label style="font-size: 11px; color: #6b7280;">Categoria:</label>
                <select id="bulk-prod-cat"></select>

                <textarea id="bulk-text-input" placeholder="Incolla qui le righe del listino, es:&#10;Sarde Fresche kg 8.50&#10;Gambero Rosso kg 35,00&#10;Pomodoro Ciliegino 2.20"></textarea>
                
                <button class="btn btn-primary" style="width: 100%;" onclick="addBulkProducts()">+ Aggiungi Tutti i Prodotti in Blocco</button>
            </div>

            <!-- AGGIUNTA MANUALE SINGOLA -->
            <div class="card">
                <div class="card-title">+ Aggiungi Prodotto Singolo</div>
                <input type="text" id="new-prod-nome" placeholder="Nome Prodotto">
                <select id="new-prod-cat"></select>
                <select id="new-prod-fornitore"></select>
                <input type="text" id="new-prod-unita" placeholder="Unità (es. kg, cassa)">
                <input type="text" id="new-prod-prezzo" placeholder="Prezzo (€)">
                <button class="btn btn-primary" onclick="addProdotto()">+ Aggiungi Prodotto</button>
            </div>

            <!-- FORNITORI -->
            <div class="card">
                <div class="card-title">Aggiungi Nuovo Fornitore</div>
                <input type="text" id="new-fornitore-nome" placeholder="Nome Fornitore">
                <input type="text" id="new-fornitore-tel" placeholder="Numero WhatsApp">
                <button class="btn btn-primary" onclick="addFornitore()">+ Aggiungi Fornitore</button>
            </div>
        </div>
    </div>

    <script>
        let defaultCategorieObj = [
            { icon: '🐟', nome: 'Pesce' },
            { icon: '🥩', nome: 'Carne' },
            { icon: '🥦', nome: 'Ortofrutta' },
            { icon: '🥫', nome: 'Secco/Scatolame' },
            { icon: '🧀', nome: 'Latticini' },
            { icon: '🍷', nome: 'Bevande' },
            { icon: '🛒', nome: 'Altro' }
        ];

        let defaultFornitori = [
            { id: 'f1', nome: 'Ortofrutta Locale', tel: '+39330000001' },
            { id: 'f2', nome: 'Pescheria del Porto', tel: '+39330000002' }
        ];

        let defaultProdotti = [
            { id: 'p1', nome: 'Sarde Fresche', cat: 'Pesce', fornitoreId: 'f2', unita: 'kg', prezzo: 8.5 },
            { id: 'p2', nome: 'Gambero Rosso', cat: 'Pesce', fornitoreId: 'f2', unita: 'kg', prezzo: 35.0 },
            { id: 'p3', nome: 'Pomodoro Ciliegino', cat: 'Ortofrutta', fornitoreId: 'f1', unita: 'kg', prezzo: 2.2 }
        ];

        let categorieObj = JSON.parse(localStorage.getItem('savino_categorie_obj')) || defaultCategorieObj;
        let fornitori = JSON.parse(localStorage.getItem('savino_fornitori')) || defaultFornitori;
        let prodotti = JSON.parse(localStorage.getItem('savino_prodotti')) || defaultProdotti;
        let carrello = JSON.parse(localStorage.getItem('savino_carrello')) || {};
        let currentCat = categorieObj[0]?.nome || 'Pesce';

        function getCatIcon(catName) {
            let found = categorieObj.find(c => c.nome === catName);
            return found ? found.icon : '🛒';
        }

        function parsePrice(val) {
            if (!val) return 0;
            let num = parseFloat(String(val).replace(',', '.'));
            return isNaN(num) ? 0 : num;
        }

        function saveData() {
            localStorage.setItem('savino_categorie_obj', JSON.stringify(categorieObj));
            localStorage.setItem('savino_fornitori', JSON.stringify(fornitori));
            localStorage.setItem('savino_prodotti', JSON.stringify(prodotti));
            localStorage.setItem('savino_carrello', JSON.stringify(carrello));
            updateHeaderTotal();
        }

        function switchTab(tabId, ev) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if (ev && ev.currentTarget) ev.currentTarget.classList.add('active');
            if (tabId === 'tab-ordini') renderOrdini();
            if (tabId === 'tab-fornitori') renderInvio();
            if (tabId === 'tab-indice') renderIndice();
            if (tabId === 'tab-gestione') renderGestione();
        }

        function updateHeaderTotal() {
            let tot = 0;
            for (let id in carrello) {
                let p = prodotti.find(x => x.id === id);
                if (p) tot += carrello[id] * p.prezzo;
            }
            let el = document.getElementById('header-tot');
            el.innerText = `Tot: €${tot.toFixed(2)}`;
            el.classList.add('bounce');
            setTimeout(() => el.classList.remove('bounce'), 200);
        }

        function renderOrdini() {
            if (!categorieObj.some(c => c.nome === currentCat)) {
                currentCat = categorieObj[0]?.nome || 'Altro';
            }

            let catGrid = document.getElementById('cat-grid');
            catGrid.innerHTML = '';
            categorieObj.forEach(c => {
                let btn = document.createElement('div');
                btn.className = `grid-btn ${c.nome === currentCat ? 'selected' : ''}`;
                btn.innerText = `${c.icon} ${c.nome}`;
                btn.onclick = () => { currentCat = c.nome; renderOrdini(); };
                catGrid.appendChild(btn);
            });

            let prodList = document.getElementById('prod-list');
            prodList.innerHTML = '';
            let filtered = prodotti.filter(p => p.cat === currentCat);

            if (filtered.length === 0) {
                prodList.innerHTML = '<p style="font-size:13px; color:#6b7280; padding:10px 0;">Nessun prodotto presente in questa categoria.</p>';
                return;
            }

            filtered.forEach(p => {
                let qty = carrello[p.id] || 0;
                let item = document.createElement('div');
                item.className = 'product-item';
                item.innerHTML = `
                    <div>
                        <strong style="font-size:14px; color:#1f2937;">${p.nome}</strong>
                        <div style="font-size:12px; color:#6b7280; font-weight:500;">€${p.prezzo.toFixed(2)} / ${p.unita}</div>
                    </div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="updateQty('${p.id}', -1)">-</button>
                        <span class="qty-val">${qty}</span>
                        <button class="qty-btn" onclick="updateQty('${p.id}', 1)">+</button>
                    </div>
                `;
                prodList.appendChild(item);
            });
        }

        function updateQty(prodId, delta) {
            let current = carrello[prodId] || 0;
            let next = current + delta;
            if (next <= 0) delete carrello[prodId];
            else carrello[prodId] = next;
            saveData();
            renderOrdini();
        }

        function renderInvio() {
            let container = document.getElementById('summary-fornitori');
            container.innerHTML = '';
            let grouped = {};
            for (let id in carrello) {
                let p = prodotti.find(x => x.id === id);
                if (p) {
                    if (!grouped[p.fornitoreId]) grouped[p.fornitoreId] = [];
                    grouped[p.fornitoreId].push({ prod: p, qty: carrello[id] });
                }
            }

            if (Object.keys(grouped).length === 0) {
                container.innerHTML = '<p style="font-size:13px; color:#6b7280;">Nessun ordine nel carrello.</p>';
                return;
            }

            for (let fId in grouped) {
                let fObj = fornitori.find(x => x.id === fId) || { nome: 'Fornitore', tel: '' };
                let items = grouped[fId];
                let subtot = 0;
                let textMsg = `*ORDINE UZZO CHEF*\n\n`;

                let card = document.createElement('div');
                card.className = 'card';
                let html = `<div class="card-title">🚚 ${fObj.nome}</div><ul style="margin-bottom:12px; font-size:13px; list-style:none;">`;

                items.forEach(i => {
                    let cost = i.qty * i.prod.prezzo;
                    subtot += cost;
                    html += `<li style="padding:5px 0; border-bottom:1px solid #f3f4f6;">${i.prod.nome}: <strong>${i.qty} ${i.prod.unita}</strong> (€${cost.toFixed(2)})</li>`;
                    textMsg += `• ${i.prod.nome}: ${i.qty} ${i.prod.unita}\n`;
                });

                textMsg += `\n*Totale: €${subtot.toFixed(2)}*`;
                html += `</ul><div style="display:flex; justify-content:space-between; align-items:center;">
                            <strong>Totale: €${subtot.toFixed(2)}</strong>
                            <button class="btn btn-whatsapp" onclick="window.open('https://wa.me/${fObj.tel}?text=${encodeURIComponent(textMsg)}', '_blank')">💬 WhatsApp</button>
                         </div>`;
                card.innerHTML = html;
                container.appendChild(card);
            }
        }

        function renderIndice() {
            let container = document.getElementById('indice-container');
            container.innerHTML = '';

            if (fornitori.length === 0) {
                container.innerHTML = '<p style="font-size:13px; color:#6b7280;">Nessun fornitore registrato.</p>';
                return;
            }

            fornitori.forEach(f => {
                let prodsFornitore = prodotti.filter(p => p.fornitoreId === f.id);
                let card = document.createElement('div');
                card.className = 'card';

                let html = `<div class="card-title-collapsible" onclick="toggleCollapsible('body-${f.id}', 'arrow-${f.id}')">
                                <span>🚚 ${f.nome} <span style="font-size:11px; font-weight:normal; color:#6b7280;">(${prodsFornitore.length} prodotti)</span></span>
                                <span id="arrow-${f.id}" class="arrow-icon">▼</span>
                            </div>
                            <div id="body-${f.id}" class="collapsible-body">`;

                if (prodsFornitore.length === 0) {
                    html += `<p style="font-size:12px; color:#9ca3af; font-style:italic; padding-top:6px;">Nessun prodotto associato.</p>`;
                } else {
                    html += `<table class="catalog-table">
                                <thead>
                                    <tr>
                                        <th>Prodotto</th>
                                        <th>Cat.</th>
                                        <th>Unità</th>
                                        <th style="text-align:right;">Prezzo</th>
                                        <th style="text-align:right;">Azioni</th>
                                    </tr>
                                </thead>
                                <tbody>`;
                    prodsFornitore.forEach(p => {
                        html += `<tr>
                                    <td><strong>${p.nome}</strong></td>
                                    <td>${getCatIcon(p.cat)}</td>
                                    <td>${p.unita}</td>
                                    <td style="text-align:right; font-weight:bold; color:#4b5320;">€${p.prezzo.toFixed(2)}</td>
                                    <td class="actions-cell">
                                        <button class="btn btn-warning btn-sm" onclick="editProdotto('${p.id}')">✏️</button>
                                        <button class="btn btn-danger btn-sm" onclick="deleteProdotto('${p.id}')">🗑️</button>
                                    </td>
                                 </tr>`;
                    });
                    html += `</tbody></table>`;
                }

                html += `</div>`;
                card.innerHTML = html;
                container.appendChild(card);
            });
        }

        function toggleCollapsible(bodyId, arrowId) {
            let body = document.getElementById(bodyId);
            let arrow = document.getElementById(arrowId);
            if (body.classList.contains('collapsed')) {
                body.classList.remove('collapsed');
                arrow.classList.remove('rotated');
            } else {
                body.classList.add('collapsed');
                arrow.classList.add('rotated');
            }
        }

        function editProdotto(prodId) {
            let p = prodotti.find(x => x.id === prodId);
            if (!p) return;

            let nuovoNome = prompt("Nome del prodotto:", p.nome);
            if (nuovoNome === null) return;

            let nuovoPrezzo = prompt("Prezzo (€):", p.prezzo);
            if (nuovoPrezzo === null) return;

            let nuovaUnita = prompt("Unità di misura (es. kg, pz, cassa):", p.unita);
            if (nuovaUnita === null) return;

            p.nome = nuovoNome.trim() || p.nome;
            p.prezzo = parsePrice(nuovoPrezzo);
            p.unita = nuovaUnita.trim() || p.unita;

            saveData();
            renderIndice();
            renderOrdini();
        }

        function deleteProdotto(prodId) {
            let p = prodotti.find(x => x.id === prodId);
            if (!p) return;

            if (confirm(`Vuoi cancellare definitivamente "${p.nome}" dal catalogo?`)) {
                prodotti = prodotti.filter(x => x.id !== prodId);
                delete carrello[prodId];
                saveData();
                renderIndice();
                renderOrdini();
            }
        }

        function exportToExcel() {
            if (prodotti.length === 0) {
                alert("Nessun prodotto da esportare.");
                return;
            }

            let exportData = prodotti.map(p => {
                let fObj = fornitori.find(f => f.id === p.fornitoreId);
                return {
                    'Fornitore': fObj ? fObj.nome : 'Non specificato',
                    'Prodotto': p.nome,
                    'Categoria': p.cat,
                    'Unità di Misura': p.unita,
                    'Prezzo (€)': p.prezzo
                };
            });

            let worksheet = XLSX.utils.json_to_sheet(exportData);
            let workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Catalogo Uzzo Chef");
            XLSX.writeFile(workbook, "Catalogo_Fornitori_UzzoChef.xlsx");
        }

        function renderGestione() {
            let fSelect1 = document.getElementById('new-prod-fornitore');
            let fSelect2 = document.getElementById('bulk-prod-fornitore');
            fSelect1.innerHTML = '';
            fSelect2.innerHTML = '';
            fornitori.forEach(f => {
                fSelect1.innerHTML += `<option value="${f.id}">${f.nome}</option>`;
                fSelect2.innerHTML += `<option value="${f.id}">${f.nome}</option>`;
            });

            let cSelect1 = document.getElementById('new-prod-cat');
            let cSelect2 = document.getElementById('bulk-prod-cat');
            cSelect1.innerHTML = '';
            cSelect2.innerHTML = '';
            categorieObj.forEach(c => {
                cSelect1.innerHTML += `<option value="${c.nome}">${c.icon} ${c.nome}</option>`;
                cSelect2.innerHTML += `<option value="${c.nome}">${c.icon} ${c.nome}</option>`;
            });

            let catContainer = document.getElementById('categories-list-container');
            catContainer.innerHTML = '';
            categorieObj.forEach((c, idx) => {
                let tag = document.createElement('div');
                tag.className = 'cat-tag';
                tag.innerHTML = `<span>${c.icon} ${c.nome}</span> <button class="btn btn-danger btn-sm" style="margin-left:6px; padding:2px 5px;" onclick="deleteCategoria(${idx})">✕</button>`;
                catContainer.appendChild(tag);
            });
        }

        function addCategoria() {
            let icon = document.getElementById('new-cat-icon').value;
            let nome = document.getElementById('new-cat-nome').value.trim();
            if (!nome) return alert("Inserisci il nome della categoria");
            if (categorieObj.some(c => c.nome.toLowerCase() === nome.toLowerCase())) {
                return alert("Categoria già esistente");
            }
            
            categorieObj.push({ icon, nome });
            saveData();
            document.getElementById('new-cat-nome').value = '';
            renderGestione();
            renderOrdini();
        }

        function deleteCategoria(idx) {
            if (categorieObj.length <= 1) {
                return alert("Devi mantenere almeno una categoria.");
            }
            let catName = categorieObj[idx].nome;
            if (confirm(`Eliminare la categoria "${catName}"?`)) {
                categorieObj.splice(idx, 1);
                if (currentCat === catName) {
                    currentCat = categorieObj[0].nome;
                }
                saveData();
                renderGestione();
                renderOrdini();
            }
        }

        function addFornitore() {
            let nome = document.getElementById('new-fornitore-nome').value.trim();
            let tel = document.getElementById('new-fornitore-tel').value.trim();
            if (!nome) return alert('Inserisci il nome del fornitore');
            fornitori.push({ id: 'f_' + Date.now(), nome, tel });
            saveData();
            document.getElementById('new-fornitore-nome').value = '';
            document.getElementById('new-fornitore-tel').value = '';
            renderGestione();
        }

        function addProdotto() {
            let nome = document.getElementById('new-prod-nome').value.trim();
            let cat = document.getElementById('new-prod-cat').value;
            let fornitoreId = document.getElementById('new-prod-fornitore').value;
            let unita = document.getElementById('new-prod-unita').value.trim() || 'kg';
            let prezzo = parsePrice(document.getElementById('new-prod-prezzo').value);

            if (!nome) return alert('Inserisci il nome del prodotto');
            prodotti.push({ id: 'p_' + Date.now(), nome, cat, fornitoreId, unita, prezzo });
            saveData();
            document.getElementById('new-prod-nome').value = '';
            document.getElementById('new-prod-prezzo').value = '';
            renderOrdini();
            alert('Prodotto aggiunto!');
        }

        function addBulkProducts() {
            let text = document.getElementById('bulk-text-input').value.trim();
            let fornitoreId = document.getElementById('bulk-prod-fornitore').value;
            let cat = document.getElementById('bulk-prod-cat').value;

            if (!text) {
                alert('Incolla almeno una riga di testo.');
                return;
            }

            let lines = text.split('\n');
            let addedCount = 0;

            lines.forEach(line => {
                let trimmed = line.trim();
                if (!trimmed) return;

                let priceMatch = trimmed.match(/(\d+[.,]?\d*)\s*(€|euro)?$/i) || trimmed.match(/(\d+[.,]\d+)/);
                let price = 0;
                let name = trimmed;
                let unita = 'kg';

                if (priceMatch) {
                    price = parsePrice(priceMatch[1]);
                    name = trimmed.replace(priceMatch[0], '').trim();
                }

                if (/\b(kg|chili|chilogrammi)\b/i.test(name)) {
                    unita = 'kg';
                    name = name.replace(/\b(kg|chili|chilogrammi)\b/gi, '').trim();
                } else if (/\b(gr|grammi)\b/i.test(name)) {
                    unita = 'gr';
                    name = name.replace(/\b(gr|grammi)\b/gi, '').trim();
                } else if (/\b(lt|litri)\b/i.test(name)) {
                    unita = 'lt';
                    name = name.replace(/\b(lt|litri)\b/gi, '').trim();
                } else if (/\b(pz|pezzi|cassa|bottiglia|btt)\b/i.test(name)) {
                    unita = 'pz';
                    name = name.replace(/\b(pz|pezzi|cassa|bottiglia|btt)\b/gi, '').trim();
                }

                name = name.replace(/[-:,]+$/, '').trim();

                if (name) {
                    prodotti.push({
                        id: 'p_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
                        nome: name,
                        cat: cat,
                        fornitoreId: fornitoreId,
                        unita: unita,
                        prezzo: price
                    });
                    addedCount++;
                }
            });

            if (addedCount > 0) {
                saveData();
                document.getElementById('bulk-text-input').value = '';
                alert(`Aggiunti con successo ${addedCount} prodotti!`);
                renderOrdini();
            } else {
                alert('Nessun prodotto valido trovato nel testo.');
            }
        }

        saveData();
        renderOrdini();
    </script>
</body>
</html>
